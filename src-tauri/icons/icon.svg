<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f051a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051421;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="polyGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A2BE2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF00FF;stop-opacity:0.2" />
    </linearGradient>

    <linearGradient id="polyGradCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00FFCC;stop-opacity:0.2" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00BFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="64" fill="url(#bgGrad)" stroke="#223344" stroke-width="4"/>
  <rect x="48" y="48" width="416" height="416" rx="48" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.1"/>

  <g>
