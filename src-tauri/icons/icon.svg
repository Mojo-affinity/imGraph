    <path d="M 112 160 L 112 128 L 144 128" fill="none" stroke="#00BFFF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M 400 160 L 400 128 L 368 128" fill="none" stroke="#00BFFF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M 112 352 L 112 384 L 144 384" fill="none" stroke="#00BFFF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M 400 352 L 400 384 L 368 384" fill="none" stroke="#00BFFF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <polygon points="256,256 160,160 352,144" fill="url(#polyGradPurple)" />
  <polygon points="256,256 352,144 384,320" fill="url(#polyGradCyan)" />
  <polygon points="256,256 384,320 192,368" fill="url(#polyGradPurple)" />
  <polygon points="256,256 192,368 160,160" fill="url(#polyGradCyan)" />

