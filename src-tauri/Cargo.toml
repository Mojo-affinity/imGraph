[package]
name = "im-graph"
version = "0.4.8"
description = "A multi-platform media viewer with tagging and rating"
authors = []
edition = "2021"

[lib]
name = "im_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ort = { git = "https://github.com/pykeio/ort", features = ["ndarray"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "tiff"] }

[profile.test]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
